# Custom I/O pin placement for LibreLane.
# Every non-directive line is a regular expression.
# Escape square brackets in bus names.

@min_distance=2.0
@bus_major

# North: clock, reset and control pins
#N
clk
rst_n
enable_i
load_i

# East: input data bus
#E
data_i\[\d+\]

# South: terminal-count output
#S
terminal_o

# West: counter output bus
#W
count_o\[\d+\]
