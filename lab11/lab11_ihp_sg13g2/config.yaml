meta:
  version: 3
  flow: Classic

DESIGN_NAME: counter

VERILOG_FILES:
  - dir::src/counter.sv

# IHP SG13G2 digital core uses VDD/VSS.
VDD_NETS:
  - VDD
GND_NETS:
  - VSS

CLOCK_PORT: clk_i
CLOCK_PERIOD: 20.0
PNR_SDC_FILE: dir::constraints/counter.sdc
SIGNOFF_SDC_FILE: dir::constraints/counter.sdc
FALLBACK_SDC: dir::constraints/counter.sdc

# An absolute floorplan is robust for this small teaching design.
FP_SIZING: absolute
DIE_AREA: [0, 0, 160, 160]
CORE_AREA: [20, 20, 140, 140]
PL_TARGET_DENSITY_PCT: 35

# Let the ihp-sg13g2 PDK configuration select routing layers and stdcells.
PRIMARY_GDSII_STREAMOUT_TOOL: klayout

# Keep all signoff/checking steps enabled in the baseline flow.
