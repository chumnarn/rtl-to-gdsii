# Optional: use only after `make collect` finds NL and SPEF views.
meta:
  version: 3
  flow: Classic

DESIGN_NAME: hier_system
VERILOG_FILES: [dir::../rtl/hier_system.sv]
USE_SLANG: true
SLANG_ARGUMENTS: ["--keep-hierarchy"]
CLOCK_PORT: clk_i
CLOCK_PERIOD: 20.0
PNR_SDC_FILE: dir::constraints.sdc
SIGNOFF_SDC_FILE: dir::constraints.sdc
FALLBACK_SDC: dir::constraints.sdc
VDD_NETS: [VDD]
GND_NETS: [VSS]
FP_SIZING: absolute
DIE_AREA: [0, 0, 600, 400]
CORE_AREA: [15, 15, 585, 385]
FP_PIN_ORDER_CFG: dir::pin_order.cfg
PL_TARGET_DENSITY_PCT: 35
PDN_CORE_RING: false
GRT_ALLOW_CONGESTION: false
PRIMARY_GDSII_STREAMOUT_TOOL: klayout
STA_MACRO_PRIORITIZE_NL: true

MACROS:
  counter_macro:
    gds: [dir::../macros/counter_macro/gds/counter_macro.gds]
    lef: [dir::../macros/counter_macro/lef/counter_macro.lef]
    vh:  [dir::../macros/counter_macro/vh/counter_macro.vh]
    nl:  [dir::../macros/counter_macro/nl/counter_macro.nl.v]
    spef:
      "*": [dir::../macros/counter_macro/spef/counter_macro.spef]
    instances:
      u_counter_macro:
        location: [55, 120]
        orientation: N
  accumulator_macro:
    gds: [dir::../macros/accumulator_macro/gds/accumulator_macro.gds]
    lef: [dir::../macros/accumulator_macro/lef/accumulator_macro.lef]
    vh:  [dir::../macros/accumulator_macro/vh/accumulator_macro.vh]
    nl:  [dir::../macros/accumulator_macro/nl/accumulator_macro.nl.v]
    spef:
      "*": [dir::../macros/accumulator_macro/spef/accumulator_macro.spef]
    instances:
      u_accumulator_macro:
        location: [360, 120]
        orientation: N
PDN_MACRO_CONNECTIONS:
  - "u_counter_macro VDD VSS VDD VSS"
  - "u_accumulator_macro VDD VSS VDD VSS"
