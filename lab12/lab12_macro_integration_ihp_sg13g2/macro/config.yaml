meta:
  version: 3
  flow: Classic

DESIGN_NAME: counter_macro

VERILOG_FILES:
  - dir::src/counter_macro.sv

VERILOG_DEFINES:
  - USE_POWER_PINS

CLOCK_PORT: clk_i
CLOCK_PERIOD: 20.0

PNR_SDC_FILE: dir::constraints.sdc
SIGNOFF_SDC_FILE: dir::constraints.sdc
FALLBACK_SDC: dir::constraints.sdc

VDD_NETS:
  - VDD

GND_NETS:
  - VSS

FP_SIZING: absolute
DIE_AREA: [0, 0, 180, 160]
CORE_AREA: [10, 10, 170, 150]

PL_TARGET_DENSITY_PCT: 35
GRT_ALLOW_CONGESTION: false

PDN_CORE_RING: true
PDN_CORE_RING_VWIDTH: 3.0
PDN_CORE_RING_HWIDTH: 3.0
PDN_CORE_RING_VSPACING: 2.0
PDN_CORE_RING_HSPACING: 2.0
PDN_CORE_RING_VOFFSET: 7.0
PDN_CORE_RING_HOFFSET: 7.0
PDN_ENABLE_PINS: true

PRIMARY_GDSII_STREAMOUT_TOOL: klayout

RUN_POST_CTS_RESIZER_TIMING: true
RUN_POST_GRT_RESIZER_TIMING: true
