meta:
  version: 2
  flow: Classic

DESIGN_NAME: routing_demo
VERILOG_FILES:
  - dir::src/routing_demo.sv

CLOCK_PORT: clk
CLOCK_PERIOD: 20.0
PNR_SDC_FILE: dir::constraints/pnr.sdc
SIGNOFF_SDC_FILE: dir::constraints/signoff.sdc

# Floorplan: intentionally leaves routing whitespace for the lab.
FP_SIZING: relative
FP_CORE_UTIL: 40
FP_ASPECT_RATIO: 1.0
FP_CORE_MARGIN: 5

# Placement settings emphasizing routability.
PL_TARGET_DENSITY_PCT: 50
PL_TIME_DRIVEN: true
PL_ROUTABILITY_DRIVEN: true

# sky130A routing stack.
RT_MIN_LAYER: met1
RT_MAX_LAYER: met5
RT_CLOCK_MIN_LAYER: met2
RT_CLOCK_MAX_LAYER: met5

# Global routing.
GRT_ADJUSTMENT: 0.30
GRT_ALLOW_CONGESTION: false
GRT_OVERFLOW_ITERS: 50
GRT_MACRO_EXTENSION: 0
GRT_ANTENNA_REPAIR_ITERS: 3
GRT_ANTENNA_REPAIR_MARGIN: 10

# Detailed routing.
DRT_THREADS: null
DRT_OPT_ITERS: 64
DRT_SAVE_SNAPSHOTS: false
DRT_SAVE_DRC_REPORT_ITERS: null
DRT_ANTENNA_REPAIR_ITERS: 3
DRT_ANTENNA_REPAIR_MARGIN: 10

# Fail the flow when routing or connectivity is incomplete.
ERROR_ON_TR_DRC: true
ERROR_ON_DISCONNECTED_PINS: true
ERROR_ON_LONG_WIRE: true
