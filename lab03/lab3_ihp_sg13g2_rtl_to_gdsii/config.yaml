# Lab 3: First RTL-to-GDSII Implementation
# LibreLane Classic Flow / IHP SG13G2 OpenPDK

DESIGN_NAME: counter

VERILOG_FILES:
  - dir::rtl/counter.sv

# Slang provides robust SystemVerilog parsing for always_ff and parameters.
USE_SLANG: true
SYNTH_PARAMETERS:
  - WIDTH=8

CLOCK_PORT: clk_i
CLOCK_PERIOD: 10.0

# A low utilization is appropriate for this very small teaching design.
FP_CORE_UTIL: 35

# Deterministic top-level pin placement.
IO_PIN_ORDER_CFG: dir::pin_order.cfg
ERRORS_ON_UNMATCHED_IO: both
